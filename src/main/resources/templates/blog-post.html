<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARILOG</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <!-- header サイト名・検索バー・投稿画面遷移ボタン -->
  <div class="header">
    <div class="flex-item" id="title">ARILOG</div>
    <div class="flex-item">検索バーいれたい</div>
    <div class="flex-item"><a href="/blog-post">投稿</a></div>
  </div>

  <div class="container">

    <div class="menu-div">
      <ul class="menu-ul">
        <li><a href="/blogs">ホーム</a></li>
        <!-- <li><a href="/blog-follow">フォロー中の投稿</a></li> -->
        <li><a href="/blog-post">投稿する</a></li>
      </ul>
    </div>

    <div class="main-div">
      <form action="/blogs" method="post">
        <div>
          <p>
            <label for="name" id="post-label">名前</label><br>
            <input type="text" id="user_name" name="user_name"><br>
          </p>
          <p>
            <label for="title" id="post-label">タイトル</label><br>
            <input type="text" id="title" name="title" width="200px"><br>
          </p>
          <p>
            <label for="post" id="post-label">ブログ本文</label><br>
            <textarea rows="20" cols="130" placeholder="本文を入力" id="post" name="post"></textarea><br>
          </p>
          <button type="submit" class="post-submit">投稿する</button>
        </div>
      </form>
    </div>

  </div>
</body>

</html>
