<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARILOG</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <!-- header サイト名・検索バー・投稿画面遷移ボタン -->
  <div class="header">
    <div class="flex-item"><a href="/blogs" id="title">ARILOG</a></div>
    <!-- <div class="flex-item">検索バーいれたい</div> -->
    <a href="/blog-post" class="post-button"><div>投稿</div></a>
  </div>

  <div class="container">

    <div class="menu-div">
      <ul class="menu-ul">
        <li><a href="/blogs">ホーム</a></li>
        <!-- <li><a href="/blog-follow">フォロー中の投稿</a></li> -->
        <li><a href="/blog-post">投稿する</a></li>
      </ul>
    </div>

    <div class="post-div">
      <form action="/blogs" method="post">
        <div>
          <p>
            <div class="post-label">
              <label for="name">名前</label><br>
            </div>
            <input type="text" id="user_name" name="user_name"><br>
          </p>
          <p>
            <div class="post-label">
              <label for="title">タイトル</label><br>
            </div>
            <input type="text" id="post-title" name="title" size="100"><br>
          </p>
          <p>
            <div class="post-label">
              <label for="post">ブログ本文</label><br>
            </div>
            <textarea rows="20" cols="130" placeholder="本文を入力" id="post" name="post"></textarea><br>
          </p>
          <button type="submit" class="post-submit">投稿する</button>
        </div>
      </form>
    </div>

  </div>
</body>

</html>
