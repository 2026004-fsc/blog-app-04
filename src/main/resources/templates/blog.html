<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARILOG</title>
  <link rel="stylesheet" href="/css/style.css">
  
</head>

<body>
  <!-- header サイト名・検索バー・投稿画面遷移ボタン -->
  <div class="header">
    <div class="flex-item" id="title">ARILOG</div>
    <!-- <div class="flex-item">検索バーいれたい</div> -->
    <a href="/blog-post" class="post-button"><div>投稿</div></a>
  </div>

  <div class="container">

    <div class="menu-div">
      <ul class="menu-ul">
        <li><a href="/blogs">ホーム</a></li>
        <!-- <li><a href="/blog-follow">フォロー中の投稿</a></li> -->
        <li><a href="/blog-post">投稿する</a></li>
      </ul>
    </div>

    <div class="main-div">
      <div class="show-blog-container">
        <p id="sub-title">新着ブログ</p>

        <div class="content-scroll">
          <p th:if="${#lists.isEmpty(newBlogs)}">タスクがありません</p>
          <nav th:each="blog : ${newBlogs}">
            <div class="blog-window">
              <a th:href="@{/blog/{id}/view(id=${blog.id})}" class="blog-window-link">
                <div><img th:src="${blog.image_path}" alt="ブログ画像" class="blog-image"></div>
                <div><span th:text="${blog.title}" class="blog-title">ブログタイトル</span></div>
              </a>
            </div>
          </nav>
        </div>
      
      </div>

      <!-- <div class="show-blog-container">
        <p id="sub-title">フォロー中</p>
        <div class="content-scroll">

        </div>
      </div> -->

    </div>

  </div>

</body>

</html>
